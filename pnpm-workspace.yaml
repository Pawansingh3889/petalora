# pnpm 11 reads build-script approvals from here rather than package.json.
# These packages ship native binaries or postinstall codegen and need to run.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
